name: Maintained OSS candidate
description: Propose a maintained open-source project that could improve this system.
title: "[OSS candidate] "
labels:
  - upstream-candidate
body:
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Maintenance, stars, and license
      description: Include current star count, license, latest release or commit date, and recent issue/PR activity.
    validations:
      required: true
  - type: dropdown
    id: admission
    attributes:
      label: Suggested admission class
      options:
        - Execution dependency
        - Source-index reference
        - Behavioral pattern
        - Do not adopt yet
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Concrete fit and tradeoffs
      description: Name the component and invariant improved, integration surface, migration cost, privacy/license risks, and likely failure modes.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Reversible proof of concept
      description: Define a bounded test, success metric, negative metric, and rollback trigger.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include customer data, credentials, private knowledge, local paths, or production screenshots.
          required: true
