name: Architecture review
description: Suggest a concrete improvement to the CRM, requirement-mining, knowledge, or isolation design.
title: "[Architecture] "
labels:
  - architecture
body:
  - type: textarea
    id: bottleneck
    attributes:
      label: Bottleneck or invariant
      description: What concrete failure mode, scaling limit, security boundary, or developer-experience problem should change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest reversible change and which component owns it.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Give a measurable success condition, regression test, and rollback trigger.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include customer data, credentials, private knowledge, local paths, or production screenshots.
          required: true
