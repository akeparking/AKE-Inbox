name: Build a new Windows release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag. Existing releases and assets are never overwritten.
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact tag and preserve old releases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing releases are immutable. Choose a new version.'
            exit 1
          fi
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Verify exact source
        run: |
          npm ci --no-fund
          npm run build -w @ake/contracts
          npm test
          npm run test:channels
          npm run test:google-guards
          python3 test/office/model-adapter-test.py
          npm run typecheck
          NEXT_PUBLIC_BASE_PATH=/sales npm run build
          node scripts/build-demo-bundle.mjs "$RUNNER_TEMP/ake-office-bundle"
          npm run check:public
          npm audit --audit-level=high
          npm ci --prefix desktop --no-fund
          npm test --prefix desktop
          npm audit --prefix desktop --audit-level=high
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --no-banner --log-opts=--all
      - name: Build Windows x64 ZIP, source, offline guide and checksums
        env:
          AKE_PACKAGE_OUTPUT: ${{ runner.temp }}/ake-windows
        shell: bash
        run: |
          set -euo pipefail
          npm run package:win --prefix desktop
          node scripts/build-desktop-release.mjs "$RELEASE_TAG" "$AKE_PACKAGE_OUTPUT/AKE-Inbox-win32-x64" "$RUNNER_TEMP/ake-release" "docs/desktop/$RELEASE_TAG-validation.json"
          cd "$RUNNER_TEMP/ake-release"
          sha256sum -c SHA256SUMS.txt
      - name: Create draft without changing old releases
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "AKE Inbox $RELEASE_TAG · Windows 工作台" --notes-file docs/desktop/release-notes.md --draft "$RUNNER_TEMP/ake-release/"*
          echo 'Draft only. Verify exact-commit CI and incremental acceptance per docs/VERSIONING.md; disclose unexecuted physical checks before publishing.'
