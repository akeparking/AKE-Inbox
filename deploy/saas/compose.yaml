name: ake-inbox-saas
services:
  db:
    image: pgvector/pgvector:pg16
    env_file: ${SAAS_PRIVATE_DIR:?Set private configuration directory}/postgres.env
    volumes:
      - data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d inbox_saas']
      interval: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    build: {context: ../.., dockerfile: Dockerfile.core}
    env_file: ${SAAS_PRIVATE_DIR}/owner.env
    volumes:
      - ./enable-rls.sql:/app/enable-rls.sql:ro
      - ./finish-schema.cjs:/app/finish-schema.cjs:ro
    command: [sh, -c, 'node apps/revenue-core/dist/database/migrate.js && node finish-schema.cjs']
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  api:
    build: {context: ../.., dockerfile: Dockerfile.core}
    env_file: ${SAAS_PRIVATE_DIR}/runtime.env
    environment:
      SAAS_MODE: 'true'
      STORE_DRIVER: postgres
      PORT: '4100'
      SAAS_WORKER_ENABLED: 'false'
      INBOX_V2_ENABLED: 'false'
      MARKETING_ENABLED: 'false'
      DEMO_SEED: 'false'
    ports: ['127.0.0.1:${SAAS_API_PORT:-14910}:4100']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      retries: 3
    restart: unless-stopped
  worker:
    build: {context: ../.., dockerfile: Dockerfile.core}
    env_file: ${SAAS_PRIVATE_DIR}/runtime.env
    environment:
      SAAS_MODE: 'true'
      STORE_DRIVER: postgres
      SAAS_WORKER_ENABLED: 'true'
      INBOX_V2_ENABLED: 'false'
      MARKETING_ENABLED: 'false'
      DEMO_SEED: 'false'
    command: [node, apps/revenue-core/dist/worker.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: {context: ../.., dockerfile: Dockerfile.web}
    env_file: ${SAAS_PRIVATE_DIR}/web.env
    environment:
      SAAS_MODE: 'true'
      SERVER_API_URL: http://api:4100
    ports: ['127.0.0.1:${SAAS_WEB_PORT:-14900}:3000']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  data:
