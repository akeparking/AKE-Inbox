<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>客户管理 · AKE Inbox</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#253345;background:#f3f5f7;font:14px/1.6 system-ui,-apple-system,sans-serif}a{color:#1968aa;text-decoration:none}header{height:64px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #dfe5eb;padding:0 24px;gap:20px}.brand{font-weight:700;letter-spacing:.05em}.brand span{color:#da251d;margin-right:12px}nav{display:flex;gap:24px;align-items:center}nav a[aria-current]{color:#172b3a;font-weight:600}main{padding:28px;max-width:1600px;margin:auto}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0;color:#68798a}.title{display:flex;justify-content:space-between;align-items:center;gap:16px}.filters{display:flex;gap:12px;margin:22px 0 18px;flex-wrap:wrap}input,select,button,.button{font:inherit;border:1px solid #d5dee7;border-radius:7px;background:#fff;color:#253345;min-height:44px;padding:9px 13px}input{min-width:250px}button,.button{cursor:pointer}button:hover,.button:hover{background:#f2f6fa}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:2px solid #257abf;outline-offset:2px}.table-wrap{background:#fff;border:1px solid #e0e6eb;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:12px;color:#6a7a8a;background:#f8fafc;font-weight:500;padding:13px 16px}td{padding:15px 16px;border-top:1px solid #edf0f4}tbody tr:hover{background:#f8fbfd}.name{font-weight:600}.sub{display:block;font-size:12px;color:#7b8795}.tag{display:inline-block;background:#edf3f8;color:#4f6478;border-radius:4px;padding:2px 7px;font-size:12px;margin:2px 4px 2px 0}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px}.empty{padding:65px 20px;text-align:center;color:#7a8895}.notice{min-height:26px;margin:10px 0;color:#8c4d12}.notice.error{color:#a32e2e}dialog{padding:0;border:1px solid #dfe5eb;border-radius:12px;width:min(610px,95vw);max-height:90dvh;color:#253345}dialog::backdrop{background:#172b3a55}.drawer-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #e3e8ed}.drawer-body{padding:22px 24px}.detail-section{margin-bottom:24px}.facts{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:0}.facts dt{color:#718090}.facts dd{margin:0;overflow-wrap:anywhere}.record{border-top:1px solid #e7ecf1;padding:12px 0}.record p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{padding:12px 16px;height:auto;align-items:flex-start;flex-direction:column}nav{gap:18px}main{padding:18px 14px}.filters{gap:8px}.filters input{min-width:0;flex:1;width:100%}.title{align-items:flex-start;flex-direction:column}.facts{grid-template-columns:80px 1fr}}
</style><script src="/ake/assets/ake-api.js" defer></script><script src="/ake/assets/ake-customers.js" defer></script></head><body>
<header><a class="brand" id="brand"><span>AKE</span>INBOX</a><nav><a id="conversations">消息中心</a><a aria-current="page">客户管理</a><a id="channels">我的渠道</a></nav></header>
<main><div class="title"><div><h1>客户管理</h1><p id="scope">正在验证访问权限…</p></div><span class="tag">OKKI 为主 · 现有规则同步</span></div>
<form class="filters" id="filters"><label class="sr" for="search">搜索客户或公司</label><input id="search" type="search" placeholder="搜索客户、公司或邮箱"><label class="sr" for="channel">渠道</label><select id="channel"><option value="">全部渠道</option><option value="website">Website</option><option value="whatsapp">WhatsApp</option><option value="email">邮箱</option></select><label class="sr" for="label">标签</label><input id="label" placeholder="标签" style="min-width:120px;width:150px"><button>筛选</button><button type="button" id="reset">重置</button></form>
<div id="notice" class="notice" role="status" aria-live="polite"></div><div class="table-wrap"><table><thead><tr><th>客户／公司</th><th>国家／地区</th><th>渠道</th><th>标签</th><th>接待坐席</th><th>OKKI 关联／阶段</th><th>最近联系</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">正在读取客户…</td></tr></tbody></table></div><div class="pagination"><span id="count"></span><button id="prev">上一页</button><button id="next">下一页</button></div></main>
<dialog id="details" aria-labelledby="detail-title"><div class="drawer-header"><h2 id="detail-title">客户资料</h2><button id="close" aria-label="关闭客户详情">关闭</button></div><div class="drawer-body" id="detail-body"></div></dialog>
</body></html>
